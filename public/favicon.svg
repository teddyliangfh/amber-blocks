<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Amber, the game's own block character (same plastic, lip, shine and
       face as the blocks in play), drawn on a 64 grid so it holds at 16px. -->
  <defs>
    <clipPath id="body"><rect x="4" y="4" width="56" height="56" rx="16"/></clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#FFB83D"/>
  <g clip-path="url(#body)">
    <rect x="0" y="50" width="64" height="14" fill="#E99418"/>
    <rect x="0" y="0" width="64" height="8" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="#C97F00" stroke-width="3"/>
  <rect x="11" y="12" width="13" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.6" transform="rotate(-16 17.5 14.25)"/>
  <ellipse cx="16.5" cy="40" rx="4.6" ry="2.8" fill="#FF7E95" opacity="0.55"/>
  <ellipse cx="47.5" cy="40" rx="4.6" ry="2.8" fill="#FF7E95" opacity="0.55"/>
  <ellipse cx="24" cy="31" rx="3.9" ry="5.3" fill="#3A2620"/>
  <ellipse cx="40" cy="31" rx="3.9" ry="5.3" fill="#3A2620"/>
  <circle cx="25.3" cy="28.6" r="1.35" fill="#FFFFFF"/>
  <circle cx="41.3" cy="28.6" r="1.35" fill="#FFFFFF"/>
  <path d="M27 40 Q32 45.2 37 40" fill="none" stroke="#3A2620" stroke-width="2.8" stroke-linecap="round"/>
</svg>
